name: Keep the Streamlit app awake

on:
  schedule:
    # Every 6 hours. Community Cloud sleeps apps that receive no visitors for a while.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Open the app in a headless browser
        env:
          APP_URL: https://bullets-over-hugs-xywe6yyf72amtjipl9zbwx.streamlit.app
        run: python scripts/keep_awake.py
